[project]
name = "mfc-controller"
version = "0.1.0"
description = "Bronkhorst MFC controller with MQTT integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bronkhorst-propar>=1.2.0",
    "paho-mqtt>=2.1.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.6.2",
]
