[project]
name = "sensor-controller"
version = "0.1.0"
description = "Async Modbus RTU sensor gateway over RS-485 with MQTT publishing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.5.0",
    "modbus-tk>=1.1.5",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.6.2",
    "sphinx-rtd-theme>=3.1.0",
]
